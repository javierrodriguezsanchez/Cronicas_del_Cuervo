{% extends 'layout.html' %}

{% block head %}
<title>Editar Diario</title>
{% endblock %}

{% block body %}
<h1>Editar Diario #{{ journal.pk }}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="button">Guardar Cambios</button>
  <a href="{% url 'admin_journals' %}">Cancelar</a>
</form>
{% endblock %}

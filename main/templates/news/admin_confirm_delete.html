{% extends 'layout.html' %}

{% block head %}
<title>Eliminar Diario</title>
{% endblock %}

{% block body %}
  <h1>Eliminar Diario #{{ journal.pk }}</h1>
  <p>¿Seguro que deseas eliminar este diario?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="button">Sí, eliminar</button>
    <a href="{% url 'admin_journals' %}">Cancelar</a>
  </form>
{% endblock %}
